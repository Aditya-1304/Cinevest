<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" fill="none">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3d46"/>
      <stop offset="1" stop-color="#0d171c"/>
    </linearGradient>
    <linearGradient id="reel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34464f"/>
      <stop offset="1" stop-color="#101c22"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4d57"/>
      <stop offset=".5" stop-color="#1a272d"/>
      <stop offset="1" stop-color="#0b1317"/>
    </linearGradient>
    <radialGradient id="glass" cx=".4" cy=".4" r=".7">
      <stop offset="0" stop-color="#9ff3ff"/>
      <stop offset=".45" stop-color="#1c6f8c"/>
      <stop offset="1" stop-color="#06222e"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d3ed05" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- tripod -->
  <g stroke="#1a272d" stroke-width="14" stroke-linecap="round">
    <path d="M330 500 L220 585"/>
    <path d="M330 500 L440 585"/>
    <path d="M330 500 L330 590"/>
  </g>
  <rect x="270" y="478" width="120" height="30" rx="8" fill="url(#barrel)" stroke="#d3ed05" stroke-opacity=".5"/>

  <!-- film reels -->
  <g>
    <path d="M300 230 Q340 205 395 230" stroke="#0b1317" stroke-width="10" fill="none"/>
    <circle cx="395" cy="140" r="98" fill="url(#reel)" stroke="#d3ed05" stroke-width="4" filter="url(#glow)"/>
    <circle cx="395" cy="140" r="22" fill="#0b1317" stroke="#d3ed05" stroke-width="3"/>
    <g fill="#0b1317" stroke="#d3ed05" stroke-opacity=".6" stroke-width="2">
      <circle cx="395" cy="82" r="17"/><circle cx="450" cy="122" r="17"/><circle cx="429" cy="187" r="17"/>
      <circle cx="361" cy="187" r="17"/><circle cx="340" cy="122" r="17"/>
    </g>

    <circle cx="228" cy="170" r="76" fill="url(#reel)" stroke="#d3ed05" stroke-width="4" filter="url(#glow)"/>
    <circle cx="228" cy="170" r="18" fill="#0b1317" stroke="#d3ed05" stroke-width="3"/>
    <g fill="#0b1317" stroke="#d3ed05" stroke-opacity=".6" stroke-width="2">
      <circle cx="228" cy="124" r="13"/><circle cx="272" cy="156" r="13"/><circle cx="255" cy="208" r="13"/>
      <circle cx="201" cy="208" r="13"/><circle cx="184" cy="156" r="13"/>
    </g>
  </g>

  <!-- camera body -->
  <rect x="150" y="240" width="360" height="240" rx="26" fill="url(#body)" stroke="#d3ed05" stroke-opacity=".55" stroke-width="2"/>
  <rect x="150" y="296" width="360" height="12" fill="#d3ed05" opacity=".9"/>
  <g fill="#0b1317" stroke="#d3ed05" stroke-opacity=".5">
    <circle cx="200" cy="420" r="16"/><circle cx="200" cy="420" r="6" fill="#d3ed05" stroke="none"/>
    <rect x="260" y="340" width="150" height="100" rx="12"/>
  </g>
  <g stroke="#d3ed05" stroke-opacity=".7" stroke-width="3" stroke-linecap="round">
    <path d="M280 365 H390"/><path d="M280 390 H360"/><path d="M280 415 H380"/>
  </g>
  <circle cx="458" cy="400" r="14" fill="#ff4d4d"/>

  <!-- eyepiece -->
  <rect x="505" y="300" width="64" height="62" rx="12" fill="url(#barrel)" stroke="#d3ed05" stroke-opacity=".5"/>
  <rect x="566" y="312" width="22" height="38" rx="8" fill="#0b1317"/>

  <!-- lens -->
  <path d="M58 296 L150 322 L150 440 L58 466 Z" fill="url(#barrel)" stroke="#d3ed05" stroke-opacity=".55" stroke-width="2"/>
  <rect x="86" y="318" width="64" height="126" fill="url(#barrel)"/>
  <g stroke="#d3ed05" stroke-opacity=".55" stroke-width="3">
    <path d="M106 318 V444"/><path d="M122 318 V444"/><path d="M138 318 V444"/>
  </g>
  <ellipse cx="58" cy="381" rx="22" ry="86" fill="#0b1317" stroke="#d3ed05" stroke-width="3"/>
  <ellipse cx="60" cy="381" rx="14" ry="62" fill="url(#glass)"/>
  <ellipse cx="55" cy="352" rx="4" ry="16" fill="#fff" opacity=".6"/>
</svg>
